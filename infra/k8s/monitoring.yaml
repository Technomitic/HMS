apiVersion: v1
kind: ConfigMap
metadata:
  name: medix-monitoring-config
  namespace: medix
data:
  alerts.yaml: |
    groups:
      - name: medix-alerts
        rules:
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate detected"
              description: "Error rate is {{ $value }} errors/sec"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High API latency detected"
              description: "p95 latency is {{ $value }}s"

          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="medix"}[1h]) > 3
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is restarting frequently"

          - alert: DatabaseConnectionPoolExhausted
            expr: pg_stat_activity_count > 80
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Database connection pool near exhaustion"
---
# Health check CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: medix-health-check
  namespace: medix
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: health-check
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://medix-api.medix.svc.cluster.local/api/v1/health)
                  if [ "$STATUS" != "200" ]; then
                    echo "UNHEALTHY: API returned $STATUS"
                    exit 1
                  fi
                  echo "HEALTHY: API returned $STATUS"
          restartPolicy: OnFailure