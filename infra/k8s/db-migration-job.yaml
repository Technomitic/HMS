apiVersion: batch/v1
kind: Job
metadata:
  name: medix-db-migrate
  namespace: medix
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: migrate
          image: ghcr.io/medix/api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: medix-secrets
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: medix-db-seed
  namespace: medix
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
        - name: seed
          image: ghcr.io/medix/api:latest
          command: ["npx", "prisma", "db", "seed"]
          envFrom:
            - secretRef:
                name: medix-secrets
      restartPolicy: Never