apiVersion: apps/v1
kind: Deployment
metadata:
  name: medix-web
  namespace: medix
  labels:
    app: medix-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medix-web
  template:
    metadata:
      labels:
        app: medix-web
    spec:
      nodeSelector:
        role: app
      containers:
        - name: web
          image: ghcr.io/medix/web:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.medix.hospital"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: medix-web
  namespace: medix
spec:
  selector:
    app: medix-web
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP